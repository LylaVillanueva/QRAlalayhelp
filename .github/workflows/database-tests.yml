name: Isolated Supabase database tests

on:
  push:
    branches: [main, 'backend/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v3
        with:
          version: 3.4.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Confirm isolated test inputs
        working-directory: QRAlalay-Backend
        shell: bash
        run: |
          set -euo pipefail
          migration_count=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test "$migration_count" -eq 16
          test "$(sed -n 's/^select plan(\([0-9][0-9]*\));$/\1/p' supabase/tests/database/20261126_resident_patch_qr_export.test.sql | head -1)" -eq 46
          test "$(sed -n 's/^select plan(\([0-9][0-9]*\));$/\1/p' supabase/tests/database/20261126_responder_history_scope.test.sql | head -1)" -eq 15
          test "$(sed -n 's/^select plan(\([0-9][0-9]*\));$/\1/p' supabase/tests/database/20261125_workflow_security.test.sql | head -1)" -eq 42
          test "$(sed -n 's/^select plan(\([0-9][0-9]*\));$/\1/p' supabase/tests/database/20261126_guardian_approval_and_resend.test.sql | head -1)" -eq 34
      - name: Start isolated Supabase stack and apply all migrations
        run: |
          set -euo pipefail
          supabase start --workdir QRAlalay-Backend --exclude studio,analytics > "$RUNNER_TEMP/supabase-start.log" 2>&1
          grep '^Applying migration ' "$RUNNER_TEMP/supabase-start.log"
          supabase db reset --workdir QRAlalay-Backend --no-seed > "$RUNNER_TEMP/supabase-reset.log" 2>&1
          grep '^Applying migration ' "$RUNNER_TEMP/supabase-reset.log"
          applied=$(grep -c '^Applying migration ' "$RUNNER_TEMP/supabase-reset.log")
          test "$applied" -eq 16
      - name: Run resident and QR export assertions (46)
        working-directory: QRAlalay-Backend
        run: supabase test db supabase/tests/database/20261126_resident_patch_qr_export.test.sql
      - name: Run responder history authorization assertions (15)
        working-directory: QRAlalay-Backend
        run: supabase test db supabase/tests/database/20261126_responder_history_scope.test.sql
      - name: Run workflow and official closure assertions (42)
        working-directory: QRAlalay-Backend
        run: supabase test db supabase/tests/database/20261125_workflow_security.test.sql
      - name: Run guardian approval and invitation resend assertions (34)
        working-directory: QRAlalay-Backend
        run: supabase test db supabase/tests/database/20261126_guardian_approval_and_resend.test.sql
      - name: Run QR encryption and Edge Function contract tests
        run: deno test --allow-env QRAlalay-Backend/supabase/functions/_shared/qr-token-crypto.test.ts QRAlalay-Backend/supabase/functions/_shared/qr-functions.test.ts QRAlalay-Backend/supabase/functions/_shared/guardian-invitation-resend.test.ts
      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --workdir QRAlalay-Backend
